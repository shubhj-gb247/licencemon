[package]
name = "licencemon"
version = "0.1.0"
edition = "2024"
authors = ["shubham.jhiknaria@neilsoft.com"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true

[dependencies]
anyhow = "1"
chrono = {version = "0.4", features = ["serde"]}
directories = "6"
hostname = "0.4"
once_cell = "1"
parking_lot = "0.12"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
reqwest = {version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"]}
tray-icon = "0.21.1"
image = { version = "0.25", default-features = false, features = ["png"] }


# Win32 APIs
windows = { version = "0.56.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
