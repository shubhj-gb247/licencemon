[package]
name = "licencemon"
version = "0.1.1"
edition = "2024"
authors = ["shubham.jhiknaria@neilsoft.com"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true

[dependencies]
chrono = {version = "0.4", features = ["serde"]}
hostname = "0.4"
once_cell = "1"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
reqwest = {version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"]}
tray-icon = "0.21.1"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2.0"
# Win32 APIs
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System", "Win32_System_Threading", "Win32_Storage", "Win32_System_Diagnostics", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
winres = "0.1"